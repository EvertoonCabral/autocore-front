# nginx config do AutoCore Front
# Serve o bundle estático do Vite + SPA fallback + headers de segurança
# básicos. Headers mais estritos (CSP) vêm na Fase 7.3.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check para orquestrador (ALB/k8s/compose)
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Assets versionados pelo Vite (hash no nome do arquivo) — cache agressivo
    # com immutable. Quando o conteúdo muda, o hash muda, o navegador baixa o
    # novo arquivo automaticamente.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Outros estáticos (favicon, robots, etc.) — cache moderado
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback: qualquer rota desconhecida cai no index.html para o
    # React Router resolver client-side. index.html nunca é cacheado —
    # garante que o usuário pega a versão mais recente do shell.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # Headers de segurança básicos (CSP detalhada vem na Fase 7.3)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        try_files $uri $uri/ /index.html;
    }

    # gzip básico para text-based assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
