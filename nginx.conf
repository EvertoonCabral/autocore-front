# nginx config do AutoCore Front
# Serve o bundle estático do Vite + SPA fallback + headers de segurança
# estritos (Fase 7.3 do ROADMAP).
#
# Para verificar o grau de segurança após deploy:
#   https://securityheaders.com/?q=https://app.suaempresa.com.br
# Target: grade A+

# ─── CSP — Content Security Policy ──────────────────────────────────────────
# Construída em escopo de mapa para deixar uma única string usável em
# add_header. Comentários explicam cada diretiva.
#
# IMPORTANTE: o `connect-src` precisa permitir a URL da API. Em dev local
# isso é http://localhost:5206; em produção, ajuste para o seu domínio (ex.
# https://api.suaempresa.com.br). Para evitar rebuild da imagem do front
# por mudança de host, considere usar mesma origem (proxy via nginx) em prod.
#
# `'unsafe-inline'` em `style-src` é necessário porque Radix UI, Recharts e
# alguns componentes injetam estilos inline. Migrar para nonces é trabalho
# futuro — alto custo de manutenção para baixo benefício real.
map $sent_http_content_type $csp_policy {
    # nginx NÃO concatena strings por quebra de linha (cada "..." vira
    # argumento separado → erro "invalid number of the map parameters").
    # Tudo em uma linha só.
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:5206 https://*; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check para orquestrador (ALB/k8s/compose)
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Assets versionados pelo Vite (hash no nome) — cache agressivo immutable
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Outros estáticos (favicon, robots, etc.) — cache moderado
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback: qualquer rota desconhecida cai no index.html para o
    # React Router resolver client-side.
    location / {
        # index.html sempre fresh (garante que o usuário pega bundle novo)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # ─── Headers de segurança ──────────────────────────────────────────
        # `always` força aplicar inclusive em respostas de erro (404, 500)

        # CSP estrita (ver map acima)
        add_header Content-Security-Policy $csp_policy always;

        # Evita MIME sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Bloqueia clickjacking (redundante com CSP frame-ancestors mas
        # mantém compatibilidade com browsers legados que não suportam CSP)
        add_header X-Frame-Options "DENY" always;

        # Política de referer minimalista
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions-Policy — desliga features que o app não usa hoje.
        # Quando entrar Fase 8.5 (câmera para fotos de OS), liberar `camera`.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

        # Cross-Origin isolation (defesa contra Spectre)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;

        # HSTS — habilitado para 2 anos com preload-ready.
        # ATENÇÃO: só descomentar quando o domínio servir 100% via HTTPS.
        # Header errado pode trancar o domínio por 2 anos no browser.
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # X-XSS-Protection: removido propositalmente. Recomendação moderna
        # (OWASP 2024+) é confiar na CSP — o legacy XSS filter dos browsers
        # virou fonte de vulnerabilidades. Não enviar é melhor que enviar 1.

        try_files $uri $uri/ /index.html;
    }

    # gzip básico para text-based assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
