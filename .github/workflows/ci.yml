name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções anteriores quando há novo push no mesmo branch — reduz
# fila e custo de Actions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Estrutura em 2 jobs:
#   1. static-checks: typecheck + lint (rápido, ~50s) — falha cedo se erro
#      de tipo ou estilo. Bloqueia o próximo job.
#   2. test-and-build: test + build (~2min). Só roda se checks estáticos
#      passarem — evita gastar minutos de Actions em código que nem compila.
#
# Cada job recheckout/setup independentes, mas o cache do npm (via
# setup-node) é compartilhado entre eles — npm ci no 2º job acerta cache
# e leva ~10s em vez de ~40s.

jobs:
  static-checks:
    name: Typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test-and-build:
    name: Test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: static-checks # só roda se typecheck + lint passaram

    # src/lib/env.ts faz parse zod das envs no momento do import (chamado
    # pelo api/client.ts → consumido por hooks de feature). Sem essa env,
    # qualquer teste/build que carregue o api/client crasha com:
    #   "VITE_API_BASE_URL não está definida ou é inválida"
    # Em dev local, vem do .env (gitignored). Em CI, é placeholder — o
    # Vite só substitui literais no bundle; testes mockam via MSW e não
    # batem nessa URL.
    env:
      VITE_API_BASE_URL: http://localhost:5206

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        # package.json já tem "test": "vitest run" — não precisa de --run extra
        run: npm test

      - name: Build
        run: npm run build
