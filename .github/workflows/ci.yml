name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções anteriores quando há novo push no mesmo branch — reduz
# fila e custo de Actions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # .nvmrc fixa em 20 — Node 20 LTS (Iron)
          node-version-file: .nvmrc
          # actions/setup-node já faz cache do npm quando há package-lock.json
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # api:types depende do openapi.json do repo do back (path relativo).
      # Em CI o back não está montado, mas src/api/schema.d.ts é commitado —
      # então pulamos a regeneração aqui. typecheck garante que o schema
      # commitado está consistente com o código.

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        # package.json já tem "test": "vitest run" — não precisa de --run extra
        run: npm test

      - name: Build
        run: npm run build
